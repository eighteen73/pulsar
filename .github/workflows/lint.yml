name: Lint and test

on:
  push:
    branches:
      - main
      - next
  pull_request:
  workflow_dispatch:
    inputs:
      matter_ref:
        description: 'Matter branch to test against (release is the built release; any other branch is built here). Empty: next for Pulsar next, else release.'
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: eighteen73/github-actions/.github/actions/lint@main
        with:
          node-version-file: .nvmrc
      # The committed build: no stylesheet may start with a byte order mark.
      - name: Check the built stylesheets
        run: node tests/lint-build.js

  browser-tests:
    name: Browser tests (wp-env)
    runs-on: ubuntu-latest
    env:
      # Pulsar's next (pushes and pull requests to it) is developed against
      # Matter's next; everything else is tested against Matter's release.
      MATTER_REF: ${{ inputs.matter_ref || ((github.ref_name == 'next' || github.base_ref == 'next') && 'next') || 'release' }}
    steps:
      - name: Checkout Pulsar
        uses: actions/checkout@v7

      # Matter is a must-use plugin; the release branch is built (build/ and
      # vendor/ included).
      - name: Checkout Matter (${{ env.MATTER_REF }})
        uses: actions/checkout@v7
        with:
          repository: eighteen73/matter
          ref: ${{ env.MATTER_REF }}
          path: .matter

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Set up PHP
        if: env.MATTER_REF != 'release'
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2

      # Any other branch isn't built: build it (npm ci installs Composer's
      # dependencies too).
      - name: Build Matter
        if: env.MATTER_REF != 'release'
        working-directory: .matter
        run: npm ci && npm run build

      - name: Install dependencies
        run: npm ci

      # Locally, .wp-env.json maps Matter from the Nebula project around the
      # theme; here it's the checkout above.
      - name: Use the Matter checkout
        run: |
          cat > .wp-env.override.json <<'JSON'
          {
            "mappings": {
              "wp-content/mu-plugins/matter": "./.matter"
            }
          }
          JSON

      - name: Start wp-env
        run: npm run env:start

      - name: Install Playwright's Chromium
        run: npx playwright install --with-deps --only-shell chromium

      - name: Run browser tests
        run: npm run test:e2e

      - name: Keep browser test artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-test-artifacts
          path: artifacts/
          retention-days: 7
